[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football-tracking"
version = "0.1.0"
description = "Local-first football match tracking and analysis platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6.1",
  "python-dotenv>=1.0,<2",
  "Pillow>=10.4,<12",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
ml = [
  "ultralytics>=8.3,<9",
  "supervision>=0.25,<0.31",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "football_tracking.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
